---
- name: Update all system packages
  ansible.builtin.dnf:
    name: "*"
    state: latest

- name: Install required system packages
  ansible.builtin.dnf:
    name:
      - git
      - python3
      - python3-pip
      - python3-devel
      - mariadb-devel
      - gcc
      - nginx
      - mariadb-server
    state: present

- name: Ensure app user exists
  ansible.builtin.user:
    name: "{{ app_user }}"
    state: present
    create_home: true
