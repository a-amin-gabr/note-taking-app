---
- name: Deploy Nginx reverse proxy configuration (base)
  ansible.builtin.template:
    src: notes-app.conf.j2
    dest: /etc/nginx/conf.d/notes-app.conf
    mode: "0644"
    force: false  # Allow Certbot to manage this file after initial creation
  notify: Restart Nginx

- name: Ensure server_name is updated in existing Nginx config
  ansible.builtin.replace:
    path: /etc/nginx/conf.d/notes-app.conf
    regexp: 'server_name\s+[^;]+;'
    replace: 'server_name {{ app_domain }};'
  when: app_domain != ""
  notify: Restart Nginx

- name: Ensure X-Forwarded-Proto is set so Flask knows we are using HTTPS
  ansible.builtin.lineinfile:
    path: /etc/nginx/conf.d/notes-app.conf
    insertafter: 'proxy_set_header X-Forwarded-For'
    line: '        proxy_set_header X-Forwarded-Proto $scheme;'
  notify: Restart Nginx

- name: Allow Nginx to make network connections (SELinux)
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  ignore_errors: true

- name: Start and enable Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Check if Nginx is configured for SSL for the current domain
  ansible.builtin.command: grep "live/{{ app_domain }}/fullchain.pem" /etc/nginx/conf.d/notes-app.conf
  register: nginx_ssl
  failed_when: false
  changed_when: false

- name: Install SSL certificate and configure Nginx (Certbot)
  ansible.builtin.command:
    cmd: >
      {{ app_dir }}/venv/bin/certbot --nginx -d {{ app_domain }}
      --non-interactive --agree-tos -m {{ certbot_email }}
      --redirect
  when:
    - app_domain != ""
    - nginx_ssl.rc != 0
  notify: Restart Nginx
