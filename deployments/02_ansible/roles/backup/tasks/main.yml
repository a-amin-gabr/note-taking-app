---
- name: Check if backup device exists
  ansible.builtin.stat:
    path: "{{ backup_device }}"
  register: backup_dev

- name: Check if backup device already has a filesystem
  ansible.builtin.command: blkid -o value -s TYPE {{ backup_device }}
  register: existing_fs
  changed_when: false
  failed_when: false
  when: backup_dev.stat.exists

- name: Format backup volume with XFS (only if no filesystem)
  ansible.builtin.command: mkfs -t xfs {{ backup_device }}
  when:
    - backup_dev.stat.exists
    - existing_fs.stdout == ""

- name: Ensure backup mount point exists
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Get UUID of backup device
  ansible.builtin.command: blkid -o value -s UUID {{ backup_device }}
  register: backup_uuid
  changed_when: false
  when: backup_dev.stat.exists

- name: Mount backup volume and persist in fstab
  ansible.posix.mount:
    path: "{{ backup_dir }}"
    src: "UUID={{ backup_uuid.stdout }}"
    fstype: xfs
    opts: defaults,nofail
    state: mounted
  when:
    - backup_dev.stat.exists
    - backup_uuid.stdout != ""

- name: Set ownership on backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"

- name: Deploy backup script from template
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ app_dir }}/backup.sh"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"

- name: Schedule daily backup cron job
  ansible.builtin.cron:
    name: "notes-app daily backup"
    user: "{{ app_user }}"
    hour: "{{ backup_cron_hour }}"
    minute: "{{ backup_cron_minute }}"
    job: "{{ app_dir }}/backup.sh >> {{ app_dir }}/backup.log 2>&1"
    state: present
