# =============================================================
# Docker Compose: Note-Taking App (3-container architecture)
# Services: app (Flask + Gunicorn), db (MariaDB), web (Nginx)
# =============================================================

services:
  db:
    image: mariadb:11
    container_name: notes-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ../../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  app:
    build:
      context: ../..
      dockerfile: deployments/03_docker/Dockerfile
    container_name: notes-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      - uploads:/app/static/uploads
    networks:
      - app-network

  web:
    image: nginx:alpine
    container_name: notes-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - app-network

volumes:
  db_data:
    name: notes-db-data
  uploads:
    name: notes-uploads

networks:
  app-network:
    name: notes-network
    driver: bridge
